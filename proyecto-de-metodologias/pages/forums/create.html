<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear foro - Estudio Colaborativo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/pages/dashboard.css" />
    <link rel="stylesheet" href="../../assets/css/components/forms.css" />
    <link rel="stylesheet" href="../../assets/css/components/messages.css" />
    <link rel="stylesheet" href="../../assets/css/pages/forums.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo-section">
        <h4 class="fw-bold text-primary mb-0">Estudio Colaborativo</h4>
        <small class="text-muted">Panel Principal</small>
      </div>

      <div class="user-info">
        <small class="text-muted">Bienvenido</small>
        <div class="fw-bold" id="userName">est</div>
      </div>

      <nav class="nav flex-column">
        <a class="nav-link" href="../dashboard.html">
          <i class="bi bi-house-door"></i>
          Dashboard
        </a>
        <a class="nav-link active" href="create.html">
          <i class="bi bi-chat-dots"></i>
          Agregar Foro
        </a>
        <a class="nav-link" href="list.html">
          <i class="bi bi-list-ul"></i>
          Lista de Foros
        </a>
        <a class="nav-link" href="../pizarra.html">
          <i class="bi bi-easel me-2"></i>
          Pizarra Compartida
        </a>
        <hr />
        <a class="nav-link text-danger" href="#" id="logoutBtn">
          <i class="bi bi-box-arrow-right"></i>
          Cerrar Sesión
        </a>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <div class="container py-5">
        <div class="forum-create-container">
          <div class="forum-create-header">
            <h2>Agregar foro</h2>
          </div>

          <!-- formulario para crear foros -->
          <form id="formForo" class="row g-3 needs-validation" novalidate>
            <div class="col-12">
              <label for="titulo" class="form-label">Título del foro</label>
              <input type="text" id="titulo" class="form-control" required />
            </div>
            <div class="col-12">
              <label for="descripcion" class="form-label">Descripción</label>
              <textarea
                id="descripcion"
                class="form-control"
                rows="4"
                required
              ></textarea>
            </div>
            <div class="col-12 text-end">
              <button class="btn btn-primary" type="submit">Crear foro</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../assets/js/services/authService.js"></script>
    <script src="../../assets/js/services/forumService.js"></script>
    <script src="../../assets/js/modules/forumCreateModule.js"></script>
    <script>
      // Inicializar dashboard
      document.addEventListener("DOMContentLoaded", function () {
        // Verificar autenticación
        const authToken = localStorage.getItem("authToken");
        const userSession = localStorage.getItem("userSession");

        if (!authToken && !userSession) {
          window.location.href = "../index.html";
          return;
        }

        // Si hay sesión pero no están las keys individuales, crearlas
        if (userSession && !authToken) {
          try {
            const session = JSON.parse(userSession);
            localStorage.setItem("authToken", session.token);
            localStorage.setItem("userId", session.id);
            localStorage.setItem("userName", session.nombre);
            localStorage.setItem("userEmail", session.correo);
          } catch (error) {
            console.error("Error al parsear la sesión:", error);
            localStorage.clear();
            window.location.href = "../../index.html";
            return;
          }
        }

        // Mostrar nombre de usuario
        const userName = localStorage.getItem("userName") || "Usuario";
        document.getElementById("userName").textContent = userName;

        // Logout
        document
          .getElementById("logoutBtn")
          .addEventListener("click", function (e) {
            e.preventDefault();
            if (confirm("¿Estás seguro de que quieres cerrar sesión?")) {
              localStorage.clear();
              window.location.href = "../index.html";
            }
          });
      });
    </script>
  </body>
</html>
