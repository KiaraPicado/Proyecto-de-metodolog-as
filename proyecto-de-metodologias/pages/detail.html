<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle del Foro - Estudio Colaborativo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/pages/dashboard.css">
  <link rel="stylesheet" href="../assets/css/components/cards.css">
  <link rel="stylesheet" href="../assets/css/components/messages.css">
  <link rel="stylesheet" href="../assets/css/pages/forums.css">
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo-section">
      <h4 class="fw-bold text-primary mb-0">Estudio Colaborativo</h4>
      <small class="text-muted">Panel Principal</small>
    </div>

    <div class="user-info">
      <small class="text-muted">Bienvenido</small>
      <div class="fw-bold" id="userName">Usuario</div>
    </div>

    <nav class="nav flex-column">
      <a class="nav-link" href="dashboard.html">
        <i class="bi bi-house-door"></i>
        Dashboard
      </a>
      <a class="nav-link active" href="list.html">
        <i class="bi bi-chat-dots"></i>
        Foros
      </a>
      <a class="nav-link" href="pizarra.html">
        <i class="bi bi-easel me-2"></i>
        Pizarra Compartida
      </a>
      <hr>
      <a class="nav-link text-danger" href="#" id="logoutBtn">
        <i class="bi bi-box-arrow-right"></i>
        Cerrar Sesión
      </a>
    </nav>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-secondary me-3" onclick="history.back()">
          <i class="bi bi-arrow-left"></i> Volver
        </button>
        <h1 class="h3 mb-0" id="forumTitle">Cargando...</h1>
      </div>
      <button class="btn btn-primary" id="newMessageBtn">
        <i class="bi bi-plus-lg me-1"></i>Nuevo Mensaje
      </button>
    </div>

    <!-- Información del foro -->
    <div class="card mb-4" id="forumInfo">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 class="card-title" id="forumInfoTitle">Cargando...</h5>
            <p class="card-text" id="forumInfoDescription">Cargando descripción...</p>
            <small class="text-muted">
              <i class="bi bi-person me-1"></i>Creado por: <span id="forumCreator">Usuario</span> • 
              <i class="bi bi-calendar me-1"></i><span id="forumDate">Fecha</span>
            </small>
          </div>
          <span class="badge bg-success" id="forumStatus">Público</span>
        </div>
      </div>
    </div>

    <!-- Filtros para mensajes -->
    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="searchMessages" class="form-label">Buscar mensajes</label>
            <input type="text" class="form-control" id="searchMessages" placeholder="Buscar en los mensajes...">
          </div>
          <div class="col-md-4">
            <label for="sortMessages" class="form-label">Ordenar por</label>
            <select class="form-select" id="sortMessages">
              <option value="newest">Más recientes</option>
              <option value="oldest">Más antiguos</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button class="btn btn-outline-secondary w-100" id="clearMessageFilters">
              <i class="bi bi-arrow-clockwise"></i> Limpiar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Mensajes del foro -->
    <div id="messagesContainer">
      <!-- Los mensajes se cargarán dinámicamente aquí -->
    </div>
  </div>

  <!-- Modal para crear nuevo mensaje -->
  <div class="modal fade" id="newMessageModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo mensaje</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="messageForm">
            <div class="mb-3">
              <label for="messageContent" class="form-label">Mensaje*</label>
              <textarea class="form-control" id="messageContent" rows="4" required maxlength="1000" placeholder="Escribe tu mensaje..."></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="createMessageBtn">
            <span class="spinner-border spinner-border-sm d-none" id="createMessageSpinner" role="status" aria-hidden="true"></span>
            <span id="createMessageBtnText">Enviar Mensaje</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Contenedor de notificaciones -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../assets/js/services/authService.js"></script>
  <script src="../assets/js/services/forumService.js"></script>
  <script src="../assets/js/pages/forum-detail.js"></script>
</body>
</html>
